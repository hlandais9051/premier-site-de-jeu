<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Mastermind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- Bouton retour -->
    <button id="btn-retour" class="btn-menu">⬅ Accueil</button>

    <!-- Bouton joueur -->
    <button id="btn-changer-joueur" class="btn-menu btn-joueur">
      👤 <span id="pseudo-affiche">?</span> ✎
    </button>
    <!-- Scoreboard -->
    <div id="scoreboard">
      <div id="scoreboard-titre">🏆 MEILLEURS SCORES</div>
      <table id="score-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Pseudo</th>
            <th>Essais</th>
          </tr>
        </thead>
        <tbody id="score-body">
          <tr>
            <td colspan="3" class="vide">Aucun score</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal pseudo -->
    <div id="modal-pseudo" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>TON PSEUDO</h2>
        <input
          type="text"
          id="input-pseudo"
          maxlength="16"
          placeholder="Entre ton pseudo..."
        />
        <button id="btn-valider-pseudo">Valider</button>
      </div>
    </div>

    <!-- Modal fin de partie -->
    <div id="modal-fin" class="modal-overlay hidden">
      <div class="modal-box">
        <div id="fin-emoji">🏆</div>
        <h2 id="fin-titre">GAGNÉ !</h2>
        <p id="fin-message">
          Tu as trouvé en <strong id="fin-essais">?</strong> essais.
        </p>
        <div id="solution-reveal"></div>
        <button id="btn-rejouer">Rejouer</button>
      </div>
    </div>

    <div id="app">
      <!-- Titre -->
      <div id="header">
        <h1 id="titre">MASTERMIND</h1>
        <p id="sous-titre">Trouve la combinaison secrète</p>
      </div>

      <!-- Zone principale -->
      <div id="main">
        <!-- Grille des essais -->
        <div id="grille-wrapper">
          <div id="grille">
            <!-- Les 10 lignes générées en JS -->
          </div>
        </div>

        <!-- Panneau droit -->
        <div id="panneau">
          <!-- Palette de couleurs -->
          <div id="palette-section">
            <div class="section-label">COULEUR</div>
            <div id="palette"></div>
          </div>

          <!-- Ligne active (slots à remplir) -->
          <div id="slots-section">
            <div class="section-label">TON ESSAI</div>
            <div id="slots-actifs"></div>
            <button id="btn-valider" disabled>VALIDER</button>
            <button id="btn-effacer">EFFACER</button>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts/script.js"></script>
  </body>
</html>
